<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Richard Menezes · Desenvolvimento web e aplicativos</title>
  <meta name="description" content="Richard Menezes é desenvolvedor web e de aplicativos autônomo.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f8;
      --fg: #1c1c1e;
      --muted: #636366;
      --accent: #4a6741;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151518;
        --fg: #f2f2f7;
        --muted: #8e8e93;
        --accent: #8bc34a;
      }
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      line-height: 1.6;
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      background: var(--bg);
      color: var(--fg);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(127, 127, 127, 0.25);
      font-size: 0.8125rem;
      color: var(--muted);
    }
    a {
      color: var(--accent);
      text-underline-offset: 0.15em;
    }
  </style>
</head>
<body>
  <header>
    <h1>Richard Menezes</h1>
    <p>Richard Menezes é desenvolvedor web e de aplicativos autônomo.</p>
  </header>
  <footer>
    <p>Sítio oficial do desenvolvedor.</p>
  </footer>
</body>
</html>
